name: Release Please

on:
  push:
    branches:
      - main
  # A transient GraphQL error on GitHub's side fails this workflow with the
  # repository untouched, and the only way to run it again was another push to
  # main — an empty commit, for a run that reads the history rather than the
  # tree. This lets it be retried as itself.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go
