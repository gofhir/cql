name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones targeting main. A PR stacked on another
  # branch got no checks at all — `gh pr checks` reported "no checks reported"
  # while the PR itself showed mergeable and clean, which reads exactly like a
  # PR that passed. Two of four open PRs were in that state.
  pull_request:

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: 'latest' makes an upstream release able to fail a build that
          # touched nothing, and makes CI disagree with whatever developers run.
          version: v2.11.4
          args: --timeout=5m
          # The action runs `golangci-lint config verify` before linting, and that
          # fetches a JSON schema from golangci-lint.run. It has failed the Lint
          # job three times here on a network timeout, with the code untouched and
          # every other check green — a failure that reads like a real one and
          # needs a rerun to clear, when the rerun works at all.
          #
          # Nothing is lost by skipping it: an invalid config makes the linter
          # itself fail on the next line, locally as well as here, so the schema
          # check only moves the error earlier at the cost of a network call.
          verify: false
          # The analysis cache the action carries between runs went bad and started
          # reporting six SA5011 nil-dereference findings in test files, on code
          # that had not changed: the release commit for v1.20.0 failed with them
          # while the commit before it — same Go 1.24.13, same pinned linter, a
          # CHANGELOG line apart — passed. Every run after that restored the same
          # cache and failed the same way, which is what made a poisoned cache look
          # like a real finding.
          #
          # The findings are false: each one is `if x == nil { t.Fatal(...) }`
          # followed by a use, and t.Fatal ends the test. Running the same linter
          # version and config locally with a cleared cache reports none of them.
          #
          # So the cache is dropped rather than the findings suppressed. It costs
          # about ten seconds per run and removes a state that can disagree with
          # both a clean CI run and every developer's machine.
          skip-cache: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt

  # The suite above runs at UTC, which is the runner's zone. That is one zone, and
  # one zone does not prove anything here: this engine assumes the evaluation
  # request's timezone offset wherever CQL says to, so a great many of its answers
  # depend on where the process runs.
  #
  # Twice in one week a change was green at UTC and wrong at the extremes — once a
  # branch answered `during` incorrectly at UTC+14 for a value that was inside the
  # interval, and it was found only because someone thought to measure in six zones
  # by hand. The repository's own notes had said "one zone proves nothing" for
  # weeks by then. This is that rule as a job rather than a habit.
  zones:
    name: Zones
    runs-on: ubuntu-latest
    strategy:
      # Every zone reports, rather than the first failure hiding the others: which
      # extremes a change breaks is the diagnosis, not noise.
      fail-fast: false
      matrix:
        include:
          # The far east and the far west of the legal offset range, which is where
          # a day boundary lands differently from UTC...
          - tz: Pacific/Kiritimati
            offset: "+1400"
          - tz: Pacific/Midway
            offset: "-1100"
          # ...and one that is not a whole number of hours, which has caught
          # arithmetic that assumed it was.
          - tz: Asia/Kathmandu
            offset: "+0545"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Without this the job would still pass — at UTC, silently, having measured
      # nothing it claims to. A check that cannot check has to fail, which this
      # repository has now learned twice: once from a conformance harness that
      # compared a value against itself, and once from a test that compared two
      # syntax errors and called them equal.
      - name: Confirm the zone applied
        env:
          TZ: ${{ matrix.tz }}
        run: |
          got=$(date +%z)
          echo "TZ=$TZ resolves to $got"
          if [ "$got" != "${{ matrix.offset }}" ]; then
            echo "::error::TZ=$TZ resolved to $got, expected ${{ matrix.offset }} —" \
                 "this job would have run at the wrong offset and reported success"
            exit 1
          fi

      - name: Run tests at ${{ matrix.tz }}
        env:
          TZ: ${{ matrix.tz }}
        # No -race and no coverage: the Test job above pays for those once. What
        # this job adds is the zone, and paying three times for the rest would buy
        # nothing.
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -v ./...

      - name: Verify module
        run: go mod verify
